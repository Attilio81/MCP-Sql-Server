<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL MCP Manager</title>
<style>
  :root {
    --bg: #0E1420;
    --panel: #16202F;
    --panel-2: #1C2839;
    --line: #26344A;
    --ink: #E7EDF5;
    --muted: #8CA0B8;
    --faint: #5A6C82;
    --copper: #E8A33D;
    --copper-dim: #A9782F;
    --ok: #3DDC97;
    --err: #FF6B6B;
    --busy: #7AA2F7;
    --mono: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --disp: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
  }
  ::selection { background: rgba(232,163,61,.35); }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ── Header: topology strip ─────────────────────────────── */
  header { margin-bottom: 30px; }
  .brand {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  h1 {
    font: 600 26px/1.2 var(--disp);
    letter-spacing: -.02em;
  }
  h1 .dim { color: var(--faint); font-weight: 400; }
  .topology {
    margin-top: 10px;
    font: 13px var(--mono);
    color: var(--muted);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .topology .node {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 4px;
    padding: 3px 10px;
  }
  .topology .node.hot { border-color: var(--copper-dim); color: var(--copper); }
  .topology .link { color: var(--faint); }
  .topology .sync { color: var(--ok); font-size: 12px; }
  .actions { display: flex; gap: 10px; }

  /* ── Buttons ────────────────────────────────────────────── */
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 14px;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--copper-dim); }
  .btn:focus-visible, .icon:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--copper); outline-offset: 1px;
  }
  .btn.primary {
    background: var(--copper);
    border-color: var(--copper);
    color: #221703;
    font-weight: 600;
  }
  .btn.primary:hover { background: #F0B45A; }
  .btn[disabled] { opacity: .5; cursor: wait; }

  /* ── Card list ──────────────────────────────────────────── */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 14px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px 14px 22px;
    overflow: hidden;
  }
  /* signature: status rail on the left edge */
  .card::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--faint);
    transition: background .3s;
  }
  .card.ok::before   { background: var(--ok); }
  .card.err::before  { background: var(--err); }
  .card.busy::before {
    background: var(--busy);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    .card.busy::before { animation: none; }
  }

  .card .name {
    font: 600 16px var(--mono);
    color: var(--ink);
    display: flex; align-items: center; gap: 10px;
  }
  .card .name .state { font: 11px var(--mono); color: var(--muted); font-weight: 400; }
  .card.err .name .state { color: var(--err); }
  .card .conn {
    grid-column: 1;
    font: 12.5px var(--mono);
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .conn .sep { color: var(--faint); padding: 0 4px; }
  .card .meta {
    grid-column: 1;
    font: 11.5px var(--mono);
    color: var(--faint);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .card .tools {
    grid-column: 2; grid-row: 1 / span 3;
    display: flex; gap: 6px;
  }
  .icon {
    border: 1px solid transparent;
    background: none;
    color: var(--muted);
    border-radius: 6px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    font-size: 15px;
    transition: color .15s, border-color .15s;
  }
  .icon:hover { color: var(--ink); border-color: var(--line); }
  .icon.del:hover { color: var(--err); }

  .empty {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty code { font-family: var(--mono); color: var(--copper); }

  /* ── Modal ──────────────────────────────────────────────── */
  dialog {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0;
    width: min(680px, calc(100vw - 32px));
    max-height: calc(100vh - 64px);
  }
  dialog::backdrop { background: rgba(5, 9, 16, .75); }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    font: 600 16px var(--disp);
  }
  .modal-body { padding: 20px; overflow: auto; max-height: calc(100vh - 190px); }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 620px) { .grid2, .grid4 { grid-template-columns: 1fr; } }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font: 11px var(--mono);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .field input:focus, .field textarea:focus { border-color: var(--copper-dim); outline: none; }
  .field .hint { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
  #dict-text { min-height: 46vh; resize: vertical; line-height: 1.6; }

  /* ── Toast ──────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--copper);
    border-radius: 8px;
    padding: 11px 18px;
    font: 13.5px var(--mono);
    max-width: min(640px, 90vw);
    transition: transform .25s ease;
    z-index: 50;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.ok  { border-left-color: var(--ok); }
  #toast.err { border-left-color: var(--err); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>SQL MCP Manager <span class="dim">/ database</span></h1>
      <div class="actions">
        <button class="btn" id="btn-cc" title="Registra il server su Claude Code (scope utente)">Registra su Claude Code</button>
        <button class="btn primary" id="btn-add">+ Aggiungi database</button>
      </div>
    </div>
    <div class="topology">
      <span class="node">Claude</span><span class="link">⇄</span><span class="node hot">sqlserver</span><span class="link">⇄</span><span class="node" id="topo-count">…</span>
      <span class="sync" id="topo-sync"></span>
    </div>
  </header>

  <div class="list" id="list"></div>
</div>

<!-- Add / edit -->
<dialog id="modal-form">
  <form id="form">
    <div class="modal-head"><span id="form-title">Nuovo database</span></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field">
          <label for="f-name">Nome</label>
          <input id="f-name" required pattern="[^/?#%]+" autocomplete="off">
          <div class="hint">Il nome che Claude usa per scegliere il database</div>
        </div>
        <div class="field">
          <label for="f-dict">File dizionario</label>
          <input id="f-dict" placeholder="(default: <nome>_dictionary.md)">
        </div>
      </div>
      <div class="field">
        <label for="f-conn">Connection string</label>
        <textarea id="f-conn" rows="3" required
          placeholder="Driver={ODBC Driver 17 for SQL Server};Server=srv;Database=db;Trusted_Connection=yes"></textarea>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-schemas">Schemi consentiti</label>
          <input id="f-schemas" placeholder="dbo,custom (vuoto = tutti)">
        </div>
        <div class="field">
          <label for="f-blacklist">Tabelle bloccate</label>
          <input id="f-blacklist" placeholder="sys_*,*_temp">
        </div>
      </div>
      <div class="grid4">
        <div class="field"><label for="f-maxrows">Max righe</label><input id="f-maxrows" type="number" value="100" min="1"></div>
        <div class="field"><label for="f-qtimeout">Timeout query (s)</label><input id="f-qtimeout" type="number" value="30" min="1"></div>
        <div class="field"><label for="f-poolsize">Pool</label><input id="f-poolsize" type="number" value="5" min="1"></div>
        <div class="field"><label for="f-pooltimeout">Timeout pool (s)</label><input id="f-pooltimeout" type="number" value="30" min="1"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" type="button" id="form-test">⚡ Prova connessione</button>
      <button class="btn" type="button" id="form-cancel">Annulla</button>
      <button class="btn primary" type="submit">Salva</button>
    </div>
  </form>
</dialog>

<!-- Dictionary editor -->
<dialog id="modal-dict">
  <div class="modal-head"><span id="dict-title">Dizionario</span></div>
  <div class="modal-body">
    <div class="field">
      <textarea id="dict-text" spellcheck="false"></textarea>
      <div class="hint">Markdown, aggiornato anche da Claude durante le sessioni. Salvando sovrascrivi il file.</div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn" id="dict-cancel">Annulla</button>
    <button class="btn primary" id="dict-save">Salva dizionario</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const list = $("list");
let servers = [];
let editing = null; // name when editing, null when adding

/* ── helpers ─────────────────────────────────────────────── */
function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "", 4200);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

function connParts(cs) {
  const get = k => (cs.match(new RegExp(k + "=([^;]*)", "i")) || [])[1] || "?";
  return { server: get("Server"), db: get("Database"),
           auth: /Trusted_Connection\s*=\s*yes/i.test(cs) ? "windows auth" : "sql auth" };
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ── render ──────────────────────────────────────────────── */
function render() {
  $("topo-count").textContent = servers.length + " database";
  $("topo-sync").textContent = servers.length ? "databases.json ⇢ claude_desktop_config.json" : "";
  if (!servers.length) {
    list.innerHTML = `<div class="empty">Nessun database configurato.<br>
      Aggiungine uno: finisce in <code>databases.json</code> e Claude vede un solo server MCP.</div>`;
    return;
  }
  list.innerHTML = servers.map((s, i) => {
    const p = connParts(s.connection_string);
    const meta = [
      s.allowed_schemas ? "schemi: " + s.allowed_schemas : "schemi: tutti",
      "max " + (s.max_rows ?? 100) + " righe",
      s.blacklist_tables ? "blacklist: " + s.blacklist_tables : null,
    ].filter(Boolean).map(esc).join("</span><span>");
    return `<div class="card" data-name="${esc(s.name)}">
      <div class="name">${esc(s.name)} <span class="state" data-state></span></div>
      <div class="conn">${esc(p.server)}<span class="sep">›</span>${esc(p.db)}<span class="sep">›</span>${p.auth}</div>
      <div class="meta"><span>${meta}</span></div>
      <div class="tools">
        <button class="icon" title="Prova connessione" data-act="test" data-i="${i}">⚡</button>
        <button class="icon" title="Dizionario semantico" data-act="dict" data-i="${i}">📖</button>
        <button class="icon" title="Modifica" data-act="edit" data-i="${i}">✏️</button>
        <button class="icon del" title="Elimina" data-act="del" data-i="${i}">🗑</button>
      </div>
    </div>`;
  }).join("");
}

list.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const s = servers[+btn.dataset.i];
  if (!s) return;
  ({ test: () => testCard(s.name), dict: () => openDict(s.name),
     edit: () => openEdit(s.name), del: () => del(s.name) })[btn.dataset.act]();
});

function setState(name, cls, label) {
  const card = list.querySelector(`.card[data-name="${CSS.escape(name)}"]`);
  if (!card) return;
  card.classList.remove("ok", "err", "busy");
  if (cls) card.classList.add(cls);
  const state = card.querySelector("[data-state]");
  const full = label || "";
  state.textContent = full.length > 90 ? full.slice(0, 90) + "…" : full;
  state.title = full; // full error on hover
}

/* ── actions ─────────────────────────────────────────────── */
async function load() {
  try {
    servers = await api("/api/servers");
    render();
    servers.forEach(s => testCard(s.name, true));
  } catch (e) {
    toast("Errore lettura configurazione: " + e.message, "err");
  }
}

async function testCard(name, silent) {
  const s = servers.find(x => x.name === name);
  if (!s) return;
  setState(name, "busy", "verifica…");
  try {
    const r = await api("/api/test", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ connection_string: s.connection_string }),
    });
    setState(name, r.ok ? "ok" : "err", r.ok ? "online" : (r.error || "connessione fallita"));
    if (!silent) toast(r.ok ? `${name}: connessione ok` : `${name}: ${r.error}`, r.ok ? "ok" : "err");
  } catch (e) {
    setState(name, "err", e.message);
  }
}

function openAdd() {
  editing = null;
  $("form-title").textContent = "Nuovo database";
  $("form").reset();
  $("f-name").disabled = false;
  $("modal-form").showModal();
}

function openEdit(name) {
  const s = servers.find(x => x.name === name);
  if (!s) return;
  editing = name;
  $("form-title").textContent = "Modifica — " + name;
  $("f-name").value = s.name;
  $("f-name").disabled = true;
  $("f-conn").value = s.connection_string || "";
  $("f-schemas").value = s.allowed_schemas || "";
  $("f-blacklist").value = s.blacklist_tables || "";
  $("f-dict").value = s.dictionary_file || "";
  $("f-maxrows").value = s.max_rows ?? 100;
  $("f-qtimeout").value = s.query_timeout ?? 30;
  $("f-poolsize").value = s.pool_size ?? 5;
  $("f-pooltimeout").value = s.pool_timeout ?? 30;
  $("modal-form").showModal();
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const entry = {
    name: editing || $("f-name").value.trim(),
    connection_string: $("f-conn").value.trim(),
    allowed_schemas: $("f-schemas").value.trim(),
    blacklist_tables: $("f-blacklist").value.trim(),
    dictionary_file: $("f-dict").value.trim(),
    max_rows: +$("f-maxrows").value || 100,
    query_timeout: +$("f-qtimeout").value || 30,
    pool_size: +$("f-poolsize").value || 5,
    pool_timeout: +$("f-pooltimeout").value || 30,
  };
  try {
    if (editing) {
      await api("/api/servers/" + encodeURIComponent(editing), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry),
      });
    } else {
      await api("/api/servers", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry),
      });
    }
    $("modal-form").close();
    toast(`${entry.name} salvato — config Claude Desktop aggiornata`, "ok");
    load();
  } catch (err) {
    toast(err.message, "err");
  }
});

$("form-cancel").addEventListener("click", () => $("modal-form").close());

$("form-test").addEventListener("click", async () => {
  const cs = $("f-conn").value.trim();
  if (!cs) { toast("Inserisci la connection string", "err"); return; }
  const btn = $("form-test");
  btn.disabled = true;
  try {
    const r = await api("/api/test", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ connection_string: cs }),
    });
    toast(r.ok ? "Connessione riuscita" : r.error, r.ok ? "ok" : "err");
  } catch (e) {
    toast(e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

async function del(name) {
  if (!confirm(`Eliminare '${name}' da databases.json?\nIl file dizionario non viene toccato.`)) return;
  try {
    await api("/api/servers/" + encodeURIComponent(name), { method: "DELETE" });
    toast(`${name} eliminato`, "ok");
    load();
  } catch (e) {
    toast(e.message, "err");
  }
}

/* ── dictionary ──────────────────────────────────────────── */
let dictServer = null;
async function openDict(name) {
  dictServer = name;
  $("dict-title").textContent = "Dizionario — " + name;
  try {
    const r = await api("/api/dictionary/" + encodeURIComponent(name));
    $("dict-text").value = r.content;
    $("modal-dict").showModal();
  } catch (e) {
    toast(e.message, "err");
  }
}
$("dict-cancel").addEventListener("click", () => $("modal-dict").close());
$("dict-save").addEventListener("click", async () => {
  try {
    await api("/api/dictionary/" + encodeURIComponent(dictServer), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: $("dict-text").value }),
    });
    $("modal-dict").close();
    toast("Dizionario salvato", "ok");
  } catch (e) {
    toast(e.message, "err");
  }
});

/* ── Claude Code registration ────────────────────────────── */
$("btn-cc").addEventListener("click", async () => {
  const btn = $("btn-cc");
  btn.disabled = true;
  try {
    const r = await api("/api/register-claude-code", { method: "POST" });
    toast(r.ok ? (r.output || "Registrato su Claude Code") : r.error, r.ok ? "ok" : "err");
  } catch (e) {
    toast(e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

$("btn-add").addEventListener("click", openAdd);
load();
</script>
</body>
</html>
